volumes:
  postgres-kc-db:
    driver: local
  postgres-be-db:
    driver: local

services:
  nginx:
    image: nginx:mainline-alpine
    container_name: nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 50m
        reservations:
          memory: 30m
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./includes:/etc/nginx/includes/:ro
      - /etc/letsencrypt/live/samsla.org/fullchain.pem:/etc/letsencrypt/live/samsla.org/fullchain.pem:ro
      - /etc/letsencrypt/live/samsla.org/privkey.pem:/etc/letsencrypt/live/samsla.org/privkey.pem:ro
      - /site-frontend/build:/usr/share/site-frontend:ro

  be-postgres:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-be-db:/var/lib/postgresql/data
    ports:
      - 5435:5432
    environment:
      POSTGRES_DB: site
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d site"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kc-postgres:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-kc-db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${DB_PASS}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_PASS}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-postgres:5432/keycloak
      KC_DB_SCHEMA: public
      KC_DB_PASSWORD: ${DB_PASS}
      KC_DB_USERNAME: admin
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_THEME: site
    volumes:
      - ./themes:/opt/keycloak/themes:Z
    depends_on:
      kc-postgres:
        condition: service_healthy
    command:
      - start
