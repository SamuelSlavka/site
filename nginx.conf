# HTTP → HTTPS redirects
server {
    listen 80;
    server_name api.samsla.org www.api.samsla.org;
    return 301 https://api.samsla.org$request_uri;
}

# backend
server {
    listen 443 ssl;
    http2 on;
    server_name api.samsla.org www.api.samsla.org;

    ssl_certificate /etc/letsencrypt/live/samsla.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samsla.org/privkey.pem;
    include /etc/nginx/includes/ssl.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include /etc/nginx/includes/proxy.conf;
        proxy_pass http://172.17.0.1:8090;
    }

    access_log off;
    error_log /var/log/nginx/error.log error;
}


# HTTP → HTTPS redirect
server {
    listen 80;
    server_name keycloak.samsla.org www.keycloak.samsla.org;
    return 301 https://keycloak.samsla.org$request_uri;
}

# keycloak
server {
    listen 443 ssl;
    http2 on;
    server_name keycloak.samsla.org www.keycloak.samsla.org;

    ssl_certificate /etc/letsencrypt/live/samsla.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samsla.org/privkey.pem;
    include /etc/nginx/includes/ssl.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        include /etc/nginx/includes/proxy.conf;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Server $http_host;
        proxy_set_header X-Request-Id $request_id;
        proxy_pass http://keycloak:8080;
    }

    access_log off;
    error_log /var/log/nginx/error.log error;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name samsla.org www.samsla.org;
    return 301 https://samsla.org$request_uri;
}

#site
server {
    listen 443 ssl;
    http2 on;
    server_name samsla.org www.samsla.org;

    ssl_certificate /etc/letsencrypt/live/samsla.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/samsla.org/privkey.pem;
    include /etc/nginx/includes/ssl.conf;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    sendfile on;
    default_type application/octet-stream;

    gzip on;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
    gzip_comp_level 6;

    root /usr/share/site-frontend;

    location / {
        try_files $uri $uri/ /index.html =404;
    }
}

