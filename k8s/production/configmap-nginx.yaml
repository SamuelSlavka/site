apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: site
data:
  default.conf: |
    server {
        listen 8080 default_server;
        server_name _;

        location = /nginx-health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 404;
        }
    }

    server {
        listen 8080;
        server_name api.samsla.org www.api.samsla.org;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            include /etc/nginx/includes/proxy.conf;
            proxy_pass http://site-backend.site.svc.cluster.local:8090;
        }

        access_log off;
        error_log /var/log/nginx/error.log error;
    }

    server {
        listen 8080;
        server_name keycloak.samsla.org www.keycloak.samsla.org;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location / {
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Server $http_host;
            proxy_set_header X-Request-Id $request_id;
            include /etc/nginx/includes/proxy.conf;
            proxy_pass http://keycloak:8080;
        }

        access_log off;
        error_log /var/log/nginx/error.log error;
    }

    server {
        listen 8080;
        server_name samsla.org www.samsla.org;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        sendfile on;
        default_type application/octet-stream;
        gzip on;
        gzip_http_version 1.1;
        gzip_min_length 256;
        gzip_vary on;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
        gzip_comp_level 6;
        root /usr/share/site-frontend;

        location / {
            try_files $uri $uri/ /index.html =404;
        }
    }
  proxy.conf: |
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_intercept_errors on;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

