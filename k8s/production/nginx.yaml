apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: site
  labels:
    app: nginx
spec:
  selector:
    app: nginx
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: site-frontend-assets
  namespace: site
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:mainline-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /nginx-health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - name: nginx-config-default
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-config-proxy
              mountPath: /etc/nginx/includes/proxy.conf
              subPath: proxy.conf
              readOnly: true
            - name: site-frontend
              mountPath: /usr/share/site-frontend
      volumes:
        - name: nginx-config-default
          configMap:
            name: nginx-config
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-config-proxy
          configMap:
            name: nginx-config
            items:
              - key: proxy.conf
                path: proxy.conf
        - name: site-frontend
          persistentVolumeClaim:
            claimName: site-frontend-assets

